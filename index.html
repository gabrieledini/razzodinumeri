<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Razzo dei Numeri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{
  --sky:#1B2A49; --sky2:#2C3E6B; --sun:#FFD23F; --coral:#FF6B6B; --mint:#4ECDC4; --paper:#FFF8E7; --ink:#1B2A49;
  --ok:#3DBE7B; --no:#FF6B6B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Fredoka','Nunito',system-ui,sans-serif;background:radial-gradient(circle at 70% 10%,var(--sky2),var(--sky) 60%);color:var(--paper);min-height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.7}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column}
h1{font-size:2.2rem;font-weight:700;text-align:center;line-height:1.1;margin:14px 0 4px}
.sub{text-align:center;opacity:.8;margin-bottom:20px}
.hidden{display:none!important}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{background:var(--paper);color:var(--ink);border:0;border-radius:22px;padding:18px 10px;font:inherit;font-weight:600;font-size:1.1rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s}
.topic:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.topic .sym{font-size:2.3rem;font-weight:700;color:var(--coral)}
.topic.all{grid-column:1/-1;background:var(--sun)}
.topic.all .sym{color:var(--ink)}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.tab{background:transparent;border:2px solid rgba(255,255,255,.4);color:var(--paper);border-radius:999px;padding:6px 16px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--mint);border-color:var(--mint);color:var(--ink)}

/* gioco */
.hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
.hud button{background:none;border:0;color:var(--paper);font:inherit;font-size:1.3rem;cursor:pointer;opacity:.8}
.fuel{height:14px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;margin-bottom:22px}
.fuel div{height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--sun));transition:width .4s}
.rocket{text-align:center;font-size:2.4rem;transition:transform .5s}
.q{background:var(--paper);color:var(--ink);border-radius:28px;padding:26px 18px;text-align:center;font-size:2.6rem;font-weight:700;min-height:130px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.q.small{font-size:1.5rem}
.q svg{width:90px;height:90px}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px}
.frac span:last-child{padding:0 6px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{background:var(--mint);color:var(--ink);border:0;border-radius:20px;padding:22px 8px;font:inherit;font-size:1.8rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s,background .2s;display:flex;justify-content:center;align-items:center}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ans.ok{background:var(--ok);color:#fff}
.ans.no{background:var(--no);color:#fff}
.ans:disabled{cursor:default}
.ans .frac span:first-child{border-color:var(--ink)}
.ans.ok .frac span:first-child,.ans.no .frac span:first-child{border-color:#fff}
.msg{text-align:center;min-height:2em;margin-top:16px;font-size:1.3rem;font-weight:600}

/* fine */
.end{text-align:center;padding-top:30px}
.big{font-size:5rem}
.score{font-size:3rem;font-weight:700;color:var(--sun)}
.btn{background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:16px 32px;font:inherit;font-size:1.2rem;font-weight:700;cursor:pointer;margin:10px 6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid rgba(255,255,255,.5);box-shadow:none}
.wrong{text-align:left;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 16px;margin:16px 0;line-height:1.7}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
@keyframes launch{to{transform:translateY(-110vh) scale(.6)}}
.launch{animation:launch 1.4s ease-in forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<main>

<section id="home">
  <h1>Razzo dei Numeri</h1>
  <p class="sub">Rispondi giusto per fare il pieno: con 10 risposte il razzo parte!</p>
  <div class="tabs">
    <button class="tab on" data-lvl="1">Classe 1ª–2ª</button>
    <button class="tab" data-lvl="2">Classe 3ª</button>
    <button class="tab" data-lvl="3">Classe 4ª–5ª</button>
  </div>
  <div class="grid" id="topics">
    <button class="topic" data-t="add"><span class="sym">+</span>Addizioni</button>
    <button class="topic" data-t="sub"><span class="sym">−</span>Sottrazioni</button>
    <button class="topic" data-t="mul"><span class="sym">×</span>Moltiplicazioni</button>
    <button class="topic" data-t="div"><span class="sym">÷</span>Divisioni</button>
    <button class="topic" data-t="tab"><span class="sym">7×8</span>Tabelline</button>
    <button class="topic" data-t="frac"><span class="sym">½</span>Frazioni</button>
    <button class="topic all" data-t="all"><span class="sym">🚀</span>Missione completa</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="hud">
    <button id="back" aria-label="Torna alla scelta">←</button>
    <span id="progress">1 / 10</span>
    <span id="streak">🔥 0</span>
  </div>
  <div class="fuel"><div id="fuel"></div></div>
  <div class="rocket" id="rocket">🚀</div>
  <div class="q" id="question"></div>
  <div class="answers" id="answers"></div>
  <p class="msg" id="msg"></p>
</section>

<section id="end" class="hidden end">
  <div class="big" id="endIcon">🌕</div>
  <p class="score" id="finalScore"></p>
  <p id="endText"></p>
  <div class="wrong hidden" id="review"></div>
  <button class="btn" id="again">Gioca ancora</button>
  <button class="btn ghost" id="menu">Altro argomento</button>
</section>

</main>

<script>
// ---------- utilità ----------
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>a.sort(()=>Math.random()-.5);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fracChoices=set=>{const keys=shuffle([...set]);return {keys,choices:keys.map(f=>fracHTML(...f.split('/')))};};
const fracHTML=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;

// stelle di sfondo
(()=>{const s=$('stars');for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.opacity=.3+Math.random()*.6;s.appendChild(e);}})();

// ---------- generatori di domande ----------
// ogni generatore ritorna {html, answer, choices:[...], render?} ; le scelte sono stringhe/HTML
function numChoices(ans,spread){
  const set=new Set([ans]);
  let guard=0;
  while(set.size<4&&guard++<50){
    let c=ans+rnd(-spread,spread);
    if(c>=0&&c!==ans)set.add(c);
  }
  return shuffle([...set]).map(String);
}
// d = difficoltà continua 0..3: parte dal livello scelto e cresce di domanda in domanda
// (ogni partita arriva all'inizio del livello successivo)
const lerp=(d,a,b)=>Math.round(a+(b-a)*Math.min(d,3)/3);
const G={
  add(d){const m=d<1?lerp(d,10,20):d<2?lerp(d,50,100):lerp(d,200,1000);let a=rnd(1,m-1),b=rnd(1,m-a);return {html:`${a} + ${b} = ?`,answer:String(a+b),choices:numChoices(a+b,d<1?3:d<2?10:50)};},
  sub(d){const m=d<1?lerp(d,10,20):d<2?lerp(d,50,100):lerp(d,200,1000);let a=rnd(2,m),b=rnd(1,a);return {html:`${a} − ${b} = ?`,answer:String(a-b),choices:numChoices(a-b,d<1?3:d<2?10:50)};},
  mul(d){let a,b,sp=6;
    if(d<0.6){a=rnd(1,5);b=rnd(1,5);}          // primi numeri
    else if(d<1.3){a=rnd(2,10);b=rnd(2,10);}    // tabelline
    else if(d<2){a=rnd(11,30);b=rnd(2,9);sp=20;} // 2 cifre × 1 cifra
    else if(d<2.5){a=rnd(20,99);b=rnd(3,9);sp=40;} // 2 cifre grandi × 1 cifra
    else{a=rnd(11,99);b=rnd(11,d<2.8?30:99);sp=90;} // 2 cifre × 2 cifre
    return {html:`${a} × ${b} = ?`,answer:String(a*b),choices:numChoices(a*b,sp)};},
  div(d){let b,q,sp=3;
    if(d<0.6){b=rnd(1,5);q=rnd(1,5);}
    else if(d<1.3){b=rnd(2,10);q=rnd(2,10);}
    else if(d<2){b=rnd(2,10);q=rnd(10,40);sp=6;}
    else if(d<2.5){b=rnd(3,12);q=rnd(20,99);sp=10;}
    else{b=rnd(11,25);q=rnd(10,60);sp=10;}   // divisore a 2 cifre
    return {html:`${b*q} ÷ ${b} = ?`,answer:String(q),choices:numChoices(q,sp)};},
  tab(d){const max=d<0.5?5:d<1?7:10;const a=rnd(1,max),b=rnd(1,10);
    // distrattori dalla stessa tabellina: più difficili e più utili
    const set=new Set([a*b]);let g=0;
    while(set.size<4&&g++<40){const c=a*rnd(1,10);if(c!==a*b)set.add(c);}
    while(set.size<4)set.add(a*b+rnd(1,5));
    return {html:`${a} × ${b} = ?`,answer:String(a*b),choices:shuffle([...set]).map(String)};},
  frac(df){
    const type=df<0.7?'read':df<1.3?pick(['read','read','compare']):df<2?pick(['read','compare','addsame']):pick(['compare','addsame','equiv','equiv']);
    if(type==='read'){ // quale frazione è colorata?
      const d=pick(df<0.7?[2,3,4]:df<1.5?[2,3,4,5,6]:[3,4,5,6,8,10,12]);const n=rnd(1,d-1);
      const set=new Set([`${n}/${d}`]);let g=0;
      while(set.size<4&&g++<40){const dd=pick([2,3,4,5,6,8]);const nn=rnd(1,dd-1);const k=`${nn}/${dd}`;if(nn*d!==n*dd)set.add(k);}
      return {html:`<div>${pizza(n,d)}</div><span style="font-size:1.4rem">Che frazione è colorata?</span>`,small:true,answer:`${n}/${d}`,...fracChoices(set)};
    }
    if(type==='compare'){ // quale è più grande?
      let a,b;do{a=[rnd(1,5),rnd(2,8)];b=[rnd(1,5),rnd(2,8)];}while(a[0]>=a[1]||b[0]>=b[1]||a[0]*b[1]===b[0]*a[1]);
      const big=a[0]*b[1]>b[0]*a[1]?a:b;
      return {html:`<span style="font-size:1.4rem">Qual è più grande?</span><div style="display:flex;gap:18px;align-items:center">${fracHTML(...a)}<span style="opacity:.4">o</span>${fracHTML(...b)}</div>`,small:true,answer:big.join('/'),choices:[fracHTML(...a),fracHTML(...b)],keys:[a.join('/'),b.join('/')]};
    }
    if(type==='addsame'){ // somma con stesso denominatore
      const d=pick([3,4,5,6,8,10]);const a=rnd(1,d-2),b=rnd(1,d-1-a);
      const ans=`${a+b}/${d}`;const set=new Set([ans]);let g=0;
      while(set.size<4&&g++<40){const k=pick([`${a+b}/${d*2}`,`${a*b}/${d}`,`${a+b+1}/${d}`,`${a+b-1}/${d}`,`${a+b}/${d+1}`]);if(k!==ans&&!k.startsWith('0/'))set.add(k);}
      return {html:`${fracHTML(a,d)} + ${fracHTML(b,d)} = ?`,answer:ans,...fracChoices(set)};
    }
    // equivalenti: quale frazione vale come...
    const d=pick([2,3,4,5]);const n=rnd(1,d-1);const k=rnd(2,4);const ans=`${n*k}/${d*k}`;
    const set=new Set([ans]);let g=0;
    while(set.size<4&&g++<40){const dd=rnd(4,20),nn=rnd(1,dd-1);const key=`${nn}/${dd}`;if(nn*d!==n*dd)set.add(key);}
    return {html:`<span style="font-size:1.4rem">Quale vale quanto</span>${fracHTML(n,d)}<span style="font-size:1.4rem">?</span>`,small:true,answer:ans,...fracChoices(set)};
  }
};
// la "pizza": disegno SVG della frazione
function pizza(n,d){
  const r=40,cx=50,cy=50;let s=`<svg viewBox="0 0 100 100" aria-label="${n} parti su ${d}">`;
  for(let i=0;i<d;i++){
    const a0=(i/d)*2*Math.PI-Math.PI/2,a1=((i+1)/d)*2*Math.PI-Math.PI/2;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const large=1/d>.5?1:0;
    s+=`<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z" fill="${i<n?'#FF6B6B':'#FFF8E7'}" stroke="#1B2A49" stroke-width="3"/>`;
  }
  return s+'</svg>';
}

// ---------- stato partita ----------
let level=1,topic='all',idx=0,score=0,streak=0,best=0,current=null,wrongs=[];
const TOTAL=10;
const ALL=['add','sub','mul','div','tab','frac'];

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');level=+t.dataset.lvl;});
document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{topic=b.dataset.t;start();});
$('back').onclick=showHome;$('menu').onclick=showHome;$('again').onclick=start;

function show(id){['home','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id));}
function showHome(){show('home');}
function start(){idx=0;score=0;streak=0;best=0;wrongs=[];$('rocket').className='rocket';$('fuel').style.width='0%';show('game');next();}

function next(){
  if(idx>=TOTAL)return finish();
  const t=topic==='all'?pick(ALL):topic;
  current=G[t]((level-1)+idx/TOTAL);
  $('progress').textContent=`${idx+1} / ${TOTAL}`;
  $('streak').textContent=`🔥 ${streak}`;
  $('msg').textContent='';
  const q=$('question');q.innerHTML=current.html;q.classList.toggle('small',!!current.small);
  const box=$('answers');box.innerHTML='';
  current.choices.forEach((c,i)=>{
    const key=current.keys?current.keys[i]:c;
    const b=document.createElement('button');b.className='ans';b.innerHTML=c;b.onclick=()=>answer(b,key);box.appendChild(b);
  });
}
function answer(btn,key){
  const ok=key===current.answer;
  document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;});
  if(ok){
    score++;streak++;best=Math.max(best,streak);
    btn.classList.add('ok');$('rocket').classList.add('pop');
    $('msg').textContent=pick(['Bravo! 🌟','Esatto! 🎉','Super! ⭐','Perfetto! 🚀']);
  }else{
    streak=0;btn.classList.add('no');
    document.querySelectorAll('.ans').forEach((b,i)=>{const k=current.keys?current.keys[i]:current.choices[i];if(k===current.answer)b.classList.add('ok');});
    $('question').classList.add('shake');
    $('msg').textContent='Quasi! Guarda la risposta verde.';
    wrongs.push({q:current.html,a:current.answer});
  }
  idx++;
  $('fuel').style.width=(score/TOTAL*100)+'%';
  setTimeout(()=>{$('rocket').classList.remove('pop');$('question').classList.remove('shake');next();},ok?800:1600);
}
function finish(){
  show('end');
  $('finalScore').textContent=`${score} / ${TOTAL}`;
  const r=$('endIcon');
  if(score===TOTAL){r.textContent='🚀';r.classList.add('launch');$('endText').textContent=`Pieno fatto, il razzo è partito! Serie migliore: ${best}.`;}
  else if(score>=7){r.textContent='🌕';r.className='big';$('endText').textContent=`Quasi al decollo! Serie migliore: ${best}. Riprova per fare il pieno.`;}
  else{r.textContent='🛠️';r.className='big';$('endText').textContent=`Il razzo ha bisogno di più carburante. Riguarda le risposte qui sotto e riprova!`;}
  const rev=$('review');
  if(wrongs.length){rev.classList.remove('hidden');rev.innerHTML='<b>Da ripassare:</b><br>'+wrongs.map(w=>{const a=w.a.includes('/')?fracHTML(...w.a.split('/')):w.a;return `${w.q.replace(/<svg[\s\S]*?<\/svg>/,'🍕').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').replace(' = ?','').trim()} → <b>${a}</b>`;}).join('<br>');}
  else rev.classList.add('hidden');
}
</script>
</body>
</html>
